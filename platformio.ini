; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; A pinned URL rather than "espressif32", because Espressif stopped publishing the
; Arduino core to the PlatformIO registry: that package is frozen at core 2.0.17 /
; ESP-IDF 4.4.7 and will not move again. pioarduino repackages the current core
; (3.3.11 / IDF 5.5.5) in the format PlatformIO understands.
;
; The reason this project needs it: DHCP option 114 (RFC 8910), which lets the
; provisioning AP tell a joining phone outright that it is a captive portal
; instead of inferring it from hijacked DNS and redirected probes. The API for it
; (WiFi.AP.enableDhcpCaptivePortal) is gated on IDF >= 5.4.2, so it does not exist
; on the registry build at all. See src/RuntimeBuild/RuntimeBuildPortal.cpp.
;
; No semver range is possible here -- a release ZIP is an exact artifact. Bumping
; this is a deliberate act, which is the right default for the layer the whole
; firmware is compiled against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    ; Pinned to the git repo, not the registry name "mrfaptastic/ESP32 HUB75 LED
    ; Matrix Panel DMA Display": maintenance moved to mrcodetastic, and the fixes
    ; this project depends on -- LCD_CAM driver changes between IDF 4.4 and 5.x --
    ; landed after the registry entry's owner changed hands. This library is the
    ; one dependency that touches the chip at a low enough level for the IDF jump
    ; to matter, so it is pinned to an exact tag rather than a range.
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    adafruit/Adafruit GFX Library@^1.12.4

# Enable PSRAM for WROOM1 (if present)
build_flags =
    -D BOARD_HAS_PSRAM
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=10

extra_scripts = pre:get_ip.py

# Use QIO/OPI flash mode for faster access (if supported)
board_build.arduino.memory_type = qio_opi

# Phase 1: enable filesystem image uploads from data/
board_build.filesystem = littlefs
    
